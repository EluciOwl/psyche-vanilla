<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preload" as="image" href="assets/images/ai-generated/main-background.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>
</head>

<body class="screen-4-analyze">
  <button class="home-colored-button">
    <img
      src="assets/images/ai-generated/home-thoughts.png"
      alt="home">
  </button>
  <div id="chart-panel">
    <select name="days" id="select-list">
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="365">Last year</option>
    </select>
    <div id="bar-chart-style">
      <canvas id="bar-chart"></canvas>
      <p id="bar-chart-empty">No entries yet 🌸</p>
    </div>
  </div>
</body>
</html>
