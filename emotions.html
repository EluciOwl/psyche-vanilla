<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="screen-3-emotions">
  <div id="emotions-panel">  
    <div id="move-emotion-panel">
      <input type="text"
              id="emotions-input"
              maxlength="15"
              autocomplete="off">  
      <div class="sparkle-effect">
        <button id="add-emotion-button">
          +
        </button>
      </div>
    </div>
    <div id="emotions-container"></div>
  </div>
  <div id="drop-panel">
    <button class="home-colored-button">
      <img
        src="assets/images/ai-generated/home-thoughts.png"
        alt="home">
    </button>
    <div id="cloud-drop-zone">
      <span id="drop-text">drop cloud here</span>
    </div>
    <button id="cloud-move-button">Release</button>
  </div>
  <div id="clouds-container"></div>
</body>
</html>
